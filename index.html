<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Dashboard</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f2f4f7;
    margin:0;
}

.container{
    max-width:1300px;
    margin:auto;
    padding:20px;
}

.header{
    text-align:center;
    margin-bottom:25px;
}

/* LAYOUT WRAPPER */
.dashboard{
    display:flex;
    flex-direction:column;
    gap:25px;
}

/* SIDEBAR */
.sidebar{
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 4px 10px rgba(0,0,0,.1);
}

.profile{
    text-align:center;
}

.profile img{
    width:120px;
    border-radius:50%;
    margin-bottom:15px;
}

.profile p{
    margin:5px 0;
}

/* MAIN CONTENT */
.content{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
}

.content div{
    background:white;
    padding:15px;
    border-radius:12px;
    box-shadow:0 3px 8px rgba(0,0,0,.1);
    text-align:center;
}

.content img{
    width:100%;
    border-radius:10px;
}

.button{
    margin-top:10px;
    padding:8px 16px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

.button:hover{
    background:#1e4fd8;
}

.footer{
    text-align:center;
    margin-top:40px;
    color:#555;
}

/* 💻 DESKTOP VIEW */
@media (min-width: 900px){
    .dashboard{
        flex-direction:row;
        align-items:flex-start;
    }

    .sidebar{
        width:300px;
        flex-shrink:0;
        position:sticky;
        top:20px;
    }

    .content{
        flex:1;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>TEACHER DASHBOARD</h1>
    </div>

    <!-- DASHBOARD LAYOUT -->
    <div class="dashboard">

        <!-- SIDEBAR -->
        <div class="sidebar">
            <div class="profile">
                <img src="6.jpg">
                <h3>Teacher Profile</h3>
                <p><strong>Name:</strong> Juan Dela Cruz</p>
                <p><strong>Position:</strong> Grade 3 Instructor</p>
                <p><strong>Department:</strong> Elementary Department</p>
                <p><strong>Email:</strong> Cruz@gmail.com</p>
                <p><strong>Status:</strong> Active</p>
            </div>
        </div>

        <!-- MAIN CONTENT -->
        <div class="content">

            <div>
                <img src="1.jpg">
                <strong>English</strong><br>
                <button class="button">View Details</button>
            </div>

            <div>
                <img src="2.jpg">
                <strong>Math</strong><br>
                <button class="button">View Details</button>
            </div>

            <div>
                <img src="3.jpg">
                <strong>Science</strong><br>
                <button class="button">View Details</button>
            </div>

            <div>
                <img src="4.jpg">
                <strong>Computer Science</strong><br>
                <button class="button">View Details</button>
            </div>

        </div>

    </div>

    <div class="footer">
        © 2026 Teacher Dashboard. All Rights Reserved
    </div>

</div>

</body>
</html>
